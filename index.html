<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 06 — Weather App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app">

    <header class="app-header">
      <h1>Weather App</h1>
      <p>Real data from Open-Meteo API</p>
    </header>

    <!-- Search bar -->
    <div class="search-row">
      <input
        type="text"
        id="city-input"
        placeholder="Enter a city name..."
        autocomplete="off"
      >
      <button id="search-btn">Search</button>
    </div>

    <!-- Quick city buttons -->
    <div class="quick-cities">
      <button class="city-btn" data-city="Jakarta">Jakarta</button>
      <button class="city-btn" data-city="Tokyo">Tokyo</button>
      <button class="city-btn" data-city="London">London</button>
      <button class="city-btn" data-city="New York">New York</button>
      <button class="city-btn" data-city="Sydney">Sydney</button>
    </div>

    <!-- Dynamic content area — loading / error / weather card -->
    <div id="content"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
